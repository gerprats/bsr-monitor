<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor BSR</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  color-scheme:light;
  --pagina:#f3f2ee; --surface-1:#fcfcfb; --surface-2:#f0efeb; --borde:#e2e0d9; --rejilla:#e9e7e1;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#85837c;
  --acento:#2a78d6; --acento-suave:#e6effb;
  --good:#0ca30c; --critical:#d03b3b; --warning:#fab219;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --sombra:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --pagina:#111110; --surface-1:#1a1a19; --surface-2:#232321; --borde:#31302d; --rejilla:#2a2927;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8b8a82;
    --acento:#3987e5; --acento-suave:#1d2c40;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --sombra:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--pagina);color:var(--text-primary);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.contenedor{max-width:1500px;margin:0 auto;padding:20px 24px 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:14px;margin:0;font-weight:600}
.estado{color:var(--text-secondary);font-size:13px;flex:1;min-width:220px}
.btn{border:1px solid var(--borde);background:var(--surface-1);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primario{background:var(--acento);border-color:var(--acento);color:#fff;font-weight:600}
.btn.primario:hover{filter:brightness(1.08)}
.btn.peligro{color:var(--critical)}
.btn:disabled{opacity:.5;cursor:default}
select.btn{padding-right:8px}
.barra{height:3px;background:var(--rejilla);border-radius:2px;overflow:hidden;margin:-8px 0 14px;visibility:hidden}
.barra.activa{visibility:visible}
.barra i{display:block;height:100%;background:var(--acento);width:0;transition:width .4s}
.tarjeta{background:var(--surface-1);border:1px solid var(--borde);border-radius:12px;box-shadow:var(--sombra)}
.filtros{padding:12px 14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.fila{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fila>label{width:62px;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.chip{border:1px solid var(--borde);background:var(--surface-1);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px;color:var(--text-secondary);white-space:nowrap}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--acento-suave);border-color:var(--acento);color:var(--text-primary);font-weight:600}
.buscar{border:1px solid var(--borde);background:var(--surface-1);border-radius:8px;padding:5px 10px;width:220px}
.espacio{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:12px 14px}
.kpi .rotulo{color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .valor{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .nota{color:var(--text-secondary);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grafica{padding:14px;margin-bottom:14px}
.cab{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.cab .sub{color:var(--text-muted);font-size:12.5px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ley{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);border-radius:8px;padding:2px 4px 2px 8px;font-size:12.5px;color:var(--text-secondary)}
.ley b{color:var(--text-primary);font-variant-numeric:tabular-nums}
.ley i{width:10px;height:10px;border-radius:3px;flex:none}
.ley button{border:0;background:none;cursor:pointer;color:var(--text-muted);padding:0 4px;font-size:14px}
#lienzo{position:relative;height:380px}
#lienzo svg{display:block;width:100%;height:100%}
#lienzo .vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);text-align:center;padding:20px}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--borde);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.14);min-width:170px;max-width:320px;z-index:5;display:none}
.tip .f{color:var(--text-muted);margin-bottom:4px}
.tip .l{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .l i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .l span{flex:1;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
.tip .l b{font-variant-numeric:tabular-nums}
.tabla-caja{overflow:auto;max-height:78vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--rejilla);padding:0;text-align:right;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--surface-1);z-index:3;font-weight:600;font-size:12.5px}
thead th button{border:0;background:none;cursor:pointer;padding:9px 10px;width:100%;text-align:right;white-space:nowrap}
thead th button:hover{background:var(--surface-2)}
th.libro,td.libro{position:sticky;left:0;background:var(--surface-1);z-index:2;text-align:left;min-width:300px;max-width:360px;border-right:1px solid var(--rejilla)}
thead th.libro{z-index:4;padding:9px 12px}
.lib{display:flex;align-items:center;gap:10px;padding:8px 12px}
.lib img,.lib .sinp{width:34px;height:50px;object-fit:cover;border-radius:3px;background:var(--surface-2);flex:none;border:1px solid var(--borde)}
.lib .t{flex:1;min-width:0}
.lib .t button{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.lib .t button:hover{color:var(--acento)}
.lib .m{color:var(--text-muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .m a{color:inherit}
.marca{display:inline-block;background:var(--surface-2);border-radius:4px;padding:0 6px;color:var(--text-secondary);margin-right:4px}
.lib .ed{border:0;background:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px}
.lib .ed:hover{background:var(--surface-2);color:var(--text-primary)}
tr.pausado td{opacity:.5}
.celda{border:0;background:none;cursor:pointer;width:100%;padding:7px 10px 6px;text-align:right;min-width:104px;border-left:3px solid transparent;display:block}
.celda:hover{background:var(--surface-2)}
.celda.sel{background:var(--surface-2)}
.celda .n{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.celda .d{font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums;height:16px}
.celda .d .ic{font-size:9px}
.sube .ic{color:var(--good)} .baja .ic{color:var(--critical)}
.celda svg{display:block;margin-left:auto;margin-top:2px}
.celda .x{color:var(--text-muted)}
td.nada{color:var(--text-muted);padding:0 10px;text-align:right}
.vacio-total{padding:60px 20px;text-align:center;color:var(--text-secondary)}
.vacio-total h2{font-size:18px;margin-bottom:6px;color:var(--text-primary)}
dialog{border:1px solid var(--borde);border-radius:14px;background:var(--surface-1);color:var(--text-primary);padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
dialog h2{font-size:16px}
dialog label{font-size:12.5px;color:var(--text-secondary);display:flex;flex-direction:column;gap:4px}
dialog input[type=text],dialog textarea{border:1px solid var(--borde);background:var(--pagina);border-radius:8px;padding:8px 10px;width:100%}
dialog textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.mercs{display:flex;flex-wrap:wrap;gap:6px}
.pie{display:flex;gap:8px;align-items:center}
.error{color:var(--critical);font-size:13px;min-height:18px}
.estatico #anadir,.estatico #actualizar,.estatico .ed,.estatico .solo-local,.estatico #sin-libros .btn{display:none}
.check{flex-direction:row!important;align-items:center;gap:8px!important}
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <h1>Monitor BSR</h1>
    <div class="estado" id="estado">Cargando…</div>
    <label class="solo-local" style="color:var(--text-muted);font-size:12.5px">Leer cada
      <select class="btn" id="intervalo">
        <option value="1">1 h</option><option value="2">2 h</option><option value="3">3 h</option>
        <option value="4">4 h</option><option value="6">6 h</option><option value="8">8 h</option>
        <option value="12">12 h</option><option value="24">24 h</option>
      </select>
    </label>
    <button class="btn" id="actualizar">↻ Actualizar ahora</button>
    <button class="btn primario" id="anadir">+ Añadir libros</button>
  </header>
  <div class="barra" id="barra"><i></i></div>

  <div id="panel" hidden>
    <div class="tarjeta filtros">
      <div class="fila"><label>Periodo</label><span id="f-rango"></span>
        <span class="espacio"></span>
        <input class="buscar" id="buscar" type="search" placeholder="Buscar título o ASIN…">
        <select class="btn" id="orden">
          <option value="marca">Ordenar: marca</option>
          <option value="mejor">Ordenar: mejor BSR</option>
          <option value="mejora">Ordenar: más mejora en 24 h</option>
        </select>
      </div>
      <div class="fila" id="fila-marcas"><label>Marca</label><span id="f-marcas" class="fila"></span></div>
      <div class="fila"><label>País</label><span id="f-mercados" class="fila"></span></div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="tarjeta grafica">
      <div class="cab">
        <h2>Evolución del BSR</h2>
        <span class="sub">Arriba = mejor posición. Haz clic en celdas, títulos o países de la tabla para comparar (máx. 8 líneas).</span>
        <span class="espacio"></span>
        <button class="btn" id="limpiar">Limpiar selección</button>
      </div>
      <div class="leyenda" id="leyenda"></div>
      <div id="lienzo"></div>
    </div>

    <div class="tarjeta"><div class="tabla-caja" id="tabla"></div></div>
  </div>

  <div class="tarjeta vacio-total" id="sin-libros" hidden>
    <h2>Todavía no hay libros</h2>
    <p>Pega los ASIN (o los enlaces de Amazon) de tus libros y empezaré a leer su BSR en cada país.</p>
    <button class="btn primario" onclick="document.getElementById('anadir').click()">+ Añadir libros</button>
  </div>
</div>

<dialog id="dlg-anadir">
  <form method="dialog" id="form-anadir">
    <h2>Añadir libros</h2>
    <label>ASIN o enlaces de Amazon (uno por línea, o separados por comas)
      <textarea id="a-texto" placeholder="B0XXXXXXXX&#10;https://www.amazon.es/dp/B0YYYYYYYY"></textarea></label>
    <label>Marca (opcional; se aplica a todos los que añadas ahora)
      <input type="text" id="a-marca" list="lista-marcas" placeholder="p. ej. Threefold Cord Press"></label>
    <label>Países a vigilar</label>
    <div class="mercs" id="a-mercs"></div>
    <div class="error" id="a-error"></div>
    <div class="pie"><span class="espacio"></span>
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      <button class="btn primario" type="submit">Añadir y leer</button></div>
  </form>
</dialog>

<dialog id="dlg-editar">
  <form method="dialog" id="form-editar">
    <h2>Editar libro <span id="e-asin" style="color:var(--text-muted);font-weight:400"></span></h2>
    <label>Título <input type="text" id="e-titulo"></label>
    <label>Marca <input type="text" id="e-marca" list="lista-marcas"></label>
    <label>Países a vigilar</label>
    <div class="mercs" id="e-mercs"></div>
    <label class="check"><input type="checkbox" id="e-activo"> Seguir leyendo este libro</label>
    <div class="pie">
      <button class="btn peligro" type="button" id="e-borrar">Eliminar libro y su historial</button>
      <span class="espacio"></span>
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      <button class="btn primario" type="submit">Guardar</button></div>
  </form>
</dialog>
<datalist id="lista-marcas"></datalist>
<script src="app.js"></script>
</body>
</html>
